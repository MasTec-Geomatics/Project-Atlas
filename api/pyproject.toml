[project]
name = "api"
version = "0.1.0"
requires-python = ">=3.14"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
]
dependencies = [
  "alembic>=1.20.1",
  "fastapi[standard]>=0.162",
  "geoalchemy2>=0.20",
  "psycopg>=3.3.6",
  "python-dotenv>=1.2.4",
  "sqlalchemy>=2.1.6",
]

[dependency-groups]
dev = [
  "httpx>=0.28.1",
  "pytest>=9.2",
  "ruff>=0.17.3",
]

[tool.fastapi]
entrypoint = "main:app"

[project]
name = "api"
version = "0.1.0"
requires-python = ">=3.14"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
]
dependencies = [
  "alembic>=1.20.1",
  "fastapi[standard]==0.162.7",
  "geoalchemy2==0.21.0",
  "psycopg==3.3.9",
  "python-dotenv>=1.2.4",
  "sqlalchemy==2.1.8",
  "structlog>=26.1.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.1",
    "pytest>=9.2",
    "rich>=15.0.0",
    "ruff>=0.17.3",
]

[tool.fastapi]
entrypoint = "main:app"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = [
  "E",
  "W",
  "F", # pycodestyle + pyflakes basics
  "I", # import sorting
  "B", # likely bugs
  "UP", # modern syntax for 3.14
  "SIM", # simplifications
  "N", # naming
  "S", # security (bandit)
  "C4", # comprehensions
  "DTZ", # timezone-naive datetimes
  "T20", # stray print()
  "PT", # pytest style
  "FAST", # FastAPI-specific
  "RUF", # ruff's own rules
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"] # assert is how pytest works

[tool.mypy]
python_version = "3.14"
plugins = ["pydantic.mypy"]
files = ["main.py", "src", "tests"]
check_untyped_defs = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers --strict-config"


name: CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

permissions:
  contents: read

# Settings the API reads at startup. The database is a throwaway service container,
# so the password is not a secret.
env:
  DATABASE_URL:           postgresql+psycopg://atlas:ci-password@localhost:5432/atlas
  REFERENCE_DATABASE_URL: postgresql+psycopg://atlas:ci-password@localhost:5432/reference
  REFERENCE_WORK_DIR:     /tmp/atlas-reference
  API_HOST:               127.0.0.1
  API_PORT:               "8000"
  LOG_LEVEL:              INFO
  LOG_JSON:               "false"

jobs:
  api:
    name:    API
    runs-on: ubuntu-24.04
    services:
      postgres:
        image:   docker.io/postgis/postgis:18-3.6
        env:
          POSTGRES_USER:     atlas
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB:       atlas
        ports:
          - 5432:5432
        options: >-
                 --health-cmd "pg_isready -U atlas"
                 --health-interval 5s
                 --health-timeout 5s
                 --health-retries 10
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install GDAL
        run:  |
              sudo apt-get update
              sudo apt-get install --yes gdal-bin

      - name: Create the reference roles and database
        env:
          PGPASSWORD: ci-password
        run:  psql --host localhost --username atlas --dbname postgres --set ON_ERROR_STOP=1 --file ../deploy/local/reference-setup.sql

      - uses: astral-sh/setup-uv@v10.4.0
        with:
          working-directory: api
          enable-cache:      true

      - name: Install dependencies
        run:  uv sync --locked

      - name: Ruff check
        run:  uv run ruff check .

      - name: Ruff format
        run:  uv run ruff format --check .

      - name: mypy
        run:  uv run mypy

      - name: pytest
        run:  uv run pytest

  web:
    name:    Web
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          working-directory: web
          version-file:      package.json
          node-version:      "26"
          cache:             true

      - name: Lint
        run:  vp lint

      - name: Format
        run:  vp fmt --check

      - name: Test
        run:  vp test

      - name: Build
        run:  vp run build

  generated:
    name:    Generated files
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: astral-sh/setup-uv@v10.4.0
        with:
          working-directory: api
          enable-cache:      true

      - name:              Install API dependencies
        working-directory: api
        run:               uv sync --locked

      - name:              Start the API
        working-directory: api
        run:               nohup uv run fastapi run --host 127.0.0.1 --port 8000 > "$RUNNER_TEMP/api.log" 2>&1 &

      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          working-directory: web
          version-file:      package.json
          node-version:      "26"
          cache:             true

      - name: Wait for the API
        run:  curl --silent --fail --retry 30 --retry-delay 1 --retry-all-errors http://127.0.0.1:8000/api/health

      - name:              Regenerate the API client
        working-directory: web
        run:               vp run api:generate

      - name:              Regenerate the route tree
        working-directory: web
        run:               vp build

      - name: Check the generated files are committed
        run:  git diff --exit-code -- web/src/api/generated.ts web/src/routeTree.gen.ts

      - name: Show the API log
        if:   failure()
        run:  cat "$RUNNER_TEMP/api.log"

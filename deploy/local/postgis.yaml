# Local development PostgreSQL instance (with PostGIS) in its own Podman pod.
# Holds the `atlas` and `reference` databases.
#
# Requires the Secret in postgis-secret.yaml (copy postgis-secret.example.yaml).
# See README.md, "Local Database".
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: Pod
metadata:
  name: postgres
  labels:
    app: postgres
spec:
  containers:
    - name: postgis
      image: docker.io/postgis/postgis:18-3.6
      ports:
        - containerPort: 5432
          hostPort: 5432
      env:
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: postgres-credentials
              key: POSTGRES_USER
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-credentials
              key: POSTGRES_PASSWORD
        - name: POSTGRES_DB
          valueFrom:
            secretKeyRef:
              name: postgres-credentials
              key: POSTGRES_DB
      volumeMounts:
        # PostgreSQL 18+ images keep data under /var/lib/postgresql/18/docker.
        - name: data
          mountPath: /var/lib/postgresql
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: postgres-data
